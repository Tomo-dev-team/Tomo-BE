name: TOMO Dev CI-CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java 21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Gradle 실행 권한 부여 (backend 기준)
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # 4. Spring Boot 빌드 (backend 모듈)
      - name: Build Spring Boot application
        working-directory: backend
        run: ./gradlew clean build -x test

      # 5. JAR 파일 Oracle Cloud 서버로 전송
      - name: Upload JAR to Oracle Cloud
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          source: backend/build/libs/TOMO-0.0.1-SNAPSHOT.jar
          target: /home/ubuntu/app

      # 6. systemd 서비스 재시작
      - name: Restart TOMO service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          script: |
            sudo systemctl restart tomo

