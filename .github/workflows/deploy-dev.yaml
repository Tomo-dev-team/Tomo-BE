name: TOMO Dev CI-CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant gradlew permission
        run: chmod +x backend/gradlew

      - name: Build Spring Boot
        working-directory: backend
        run: ./gradlew clean build -x test

      # 1️⃣ JAR 업로드 (이미 tomo.jar로 올라가는 구조)
      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          source: backend/build/libs/TOMO-*.jar
          target: /home/ubuntu/app

      # 2️⃣ Blue / Green 무중단 스위치
      - name: Blue-Green Deploy & Switch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          script: |
            set -e

            echo "== Determine active port from nginx =="
            ACTIVE_PORT=$(grep -oE 'server 127\.0\.0\.1:(8081|8082);' /etc/nginx/sites-enabled/tomo.conf | grep -oE '8081|8082')

            if [ "$ACTIVE_PORT" = "8081" ]; then
              TARGET_PORT=8082
            else
              TARGET_PORT=8081
            fi

            echo "ACTIVE_PORT=$ACTIVE_PORT"
            echo "TARGET_PORT=$TARGET_PORT"

            echo "== Reload systemd =="
            sudo systemctl daemon-reload

            echo "== Restart inactive service =="
            sudo systemctl restart tomo-$TARGET_PORT

            echo "== Health check on $TARGET_PORT =="
            for i in {1..10}; do
              if curl -sf http://localhost:$TARGET_PORT/swagger-ui/index.html > /dev/null; then
                echo "Health check OK"
                break
              fi
              sleep 3
            done

            echo "== Switch nginx upstream =="
            sudo sed -i "s/server 127.0.0.1:$ACTIVE_PORT;/server 127.0.0.1:$TARGET_PORT;/" \
              /etc/nginx/sites-enabled/tomo.conf

            sudo nginx -t
            sudo systemctl reload nginx

            echo "== Deployment completed. Traffic switched to $TARGET_PORT =="
