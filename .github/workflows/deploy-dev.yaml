name: TOMO Dev CI-CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # 1. Checkout
      # =====================
      - name: Checkout
        uses: actions/checkout@v4

      # =====================
      # 2. JDK 21
      # =====================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # =====================
      # 3. gradlew 권한
      # =====================
      - name: Grant gradlew permission
        run: chmod +x backend/gradlew

      # =====================
      # 4. Build
      # =====================
      - name: Build Spring Boot
        working-directory: backend
        run: ./gradlew clean build -x test

      # =====================
      # 5. Upload JAR (경로 평탄화)
      # =====================
      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          source: backend/build/libs/TOMO-0.0.1-SNAPSHOT.jar
          target: /home/ubuntu/app
          strip_components: 3

      # =====================
      # 6. Blue / Green Deploy
      # =====================
      - name: Blue-Green Deploy & Switch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          script: |
            set -e

            echo "== Replace tomo.jar with latest build =="
            sudo cp /home/ubuntu/app/TOMO-0.0.1-SNAPSHOT.jar /home/ubuntu/app/tomo.jar
            sudo chown ubuntu:ubuntu /home/ubuntu/app/tomo.jar

            echo "== Determine active port from nginx =="
            ACTIVE_PORT=$(grep -oE 'server 127\.0\.0\.1:(8081|8082);' /etc/nginx/sites-enabled/tomo.conf | grep -oE '8081|8082')

            if [ "$ACTIVE_PORT" = "8081" ]; then
              TARGET_PORT=8082
            else
              TARGET_PORT=8081
            fi

            echo "ACTIVE_PORT=$ACTIVE_PORT"
            echo "TARGET_PORT=$TARGET_PORT"

            echo "== Reload systemd =="
            sudo systemctl daemon-reload

            echo "== Restart inactive service (tomo-$TARGET_PORT) =="
            sudo systemctl restart tomo-$TARGET_PORT

            echo "== Health check on $TARGET_PORT =="
            HEALTH_OK=false
            HEALTH_BODY=$(mktemp)

            for i in {1..30}; do
              HEALTH_STATUS=$(curl -sS -o "$HEALTH_BODY" -w '%{http_code}' \
                http://127.0.0.1:$TARGET_PORT/actuator/health || true)

              if [ "$HEALTH_STATUS" = "200" ] && grep '"status":"UP"' "$HEALTH_BODY" > /dev/null; then
                echo "Health check OK"
                HEALTH_OK=true
                break
              fi

              echo "Health check failed ($i/30, HTTP $HEALTH_STATUS): $(cat "$HEALTH_BODY")"
              sleep 3
            done

            rm -f "$HEALTH_BODY"

            if [ "$HEALTH_OK" != "true" ]; then
              echo "Health check failed. Deployment aborted."
              sudo systemctl show tomo-$TARGET_PORT \
                --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,NRestarts \
                --no-pager
              sudo journalctl -u tomo-$TARGET_PORT -n 120 --no-pager -o cat \
                | grep -E 'APPLICATION FAILED|ERROR|Exception|Caused by|Failed to|Address already in use' \
                | tail -n 40 || true
              exit 1
            fi

            echo "== Switch nginx upstream =="
            sudo sed -i "s/server 127.0.0.1:$ACTIVE_PORT;/server 127.0.0.1:$TARGET_PORT;/" \
              /etc/nginx/sites-enabled/tomo.conf

            sudo nginx -t
            sudo systemctl reload nginx

            echo "== Keep previous service running (rollback safe) =="
            sudo systemctl start tomo-$ACTIVE_PORT || true

            echo "== Deployment completed. Traffic switched to $TARGET_PORT =="
